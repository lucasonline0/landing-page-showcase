name: Capture landing page screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-screenshots.yml'
      - 'scripts/capture.mjs'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Serve showcase
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/showcase-http.log 2>&1 &
          sleep 2

      - name: Capture all landing pages
        run: node scripts/capture.mjs

      - name: Verify screenshots
        run: |
          test "$(find docs/screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          ls -lh docs/screenshots

      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots are already up to date.'
          else
            git commit -m 'docs: add landing page screenshots'
            git push
          fi
